<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=1280"/>
  <title>URA12 — 5 Years</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <!-- Boot screen WinXP style -->
  <div id="ura-boot">
    <div id="ura-boot-inner">
      <div id="ura-boot-flag">
        <div style="background:#E14B3A;border-radius:3px 0 0 0"></div>
        <div style="background:#B6E07C;border-radius:0 3px 0 0"></div>
        <div style="background:#FFE6BE;border-radius:0 0 3px 0"></div>
        <div style="background:#88D8D8;border-radius:0 0 0 3px"></div>
      </div>
      <div id="ura-boot-wordmark">
        <div id="ura-boot-name">URA<span>12</span></div>
        <div id="ura-boot-edition">Anniversaire Edition</div>
      </div>
      <div id="ura-boot-bar-wrap">
        <div id="ura-boot-bar">
          <div class="bseg"></div><div class="bseg"></div><div class="bseg"></div>
          <div class="bseg"></div><div class="bseg"></div><div class="bseg"></div>
          <div class="bseg"></div><div class="bseg"></div>
        </div>
      </div>
      <div id="ura-boot-msg">Chargement des souvenirs…</div>
    </div>
  </div>
  <style>
    #ura-boot {
      position: fixed; inset: 0; background: #000;
      display: flex; align-items: center; justify-content: center;
      z-index: 99999; font-family: Tahoma, sans-serif;
    }
    #ura-boot-inner { text-align: center; }
    #ura-boot-flag {
      display: grid; grid-template-columns: 1fr 1fr; gap: 5px;
      width: 56px; height: 56px; margin: 0 auto 10px;
    }
    #ura-boot-name {
      font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
      font-size: 46px; color: #fff; letter-spacing: 2px; line-height: 1;
    }
    #ura-boot-name span { color: #E14B3A; }
    #ura-boot-edition { font-size: 13px; color: #A8CDEC; margin-top: 2px; }
    #ura-boot-bar-wrap {
      width: 198px; height: 16px; overflow: hidden;
      border: 1px solid #444; background: #111;
      margin: 22px auto 8px; border-radius: 1px;
    }
    #ura-boot-bar {
      display: flex; gap: 6px; padding: 2px;
      animation: boot-march 0.9s linear infinite;
    }
    .bseg {
      width: 20px; height: 12px; flex-shrink: 0;
      background: linear-gradient(180deg, #6ddd90 0%, #3aad60 100%);
      border-radius: 1px;
    }
    @keyframes boot-march {
      from { transform: translateX(0); }
      to   { transform: translateX(-26px); }
    }
    #ura-boot-msg { font-size: 12px; color: #555; }
  </style>

  <div id="root"></div>

  <!-- React -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <!-- Data layer (must load before any JSX) -->
  <script src="supabase-client.js"></script>
  <script src="members.js"></script>

  <!-- UI components -->
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="window.jsx"></script>
  <script type="text/babel" src="login.jsx"></script>
  <script type="text/babel" src="stickers.jsx"></script>
  <script type="text/babel" src="birthday.jsx"></script>
  <script type="text/babel" src="redherrings.jsx"></script>
  <script type="text/babel" src="pages-1.jsx"></script>
  <script type="text/babel" src="pages-2.jsx"></script>
  <script type="text/babel" src="casino.jsx"></script>
  <script type="text/babel" src="esport.jsx"></script>
  <script type="text/babel" src="sondages.jsx"></script>
  <script type="text/babel" src="taxes.jsx"></script>
  <script type="text/babel" src="admin.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
